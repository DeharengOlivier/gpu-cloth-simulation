name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, for the physics tests too slow to run on every push.
    - cron: "0 3 * * *"

# A second push to the same branch cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format, lints and CPU tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies for eframe
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev
      - name: Format
        run: cargo fmt --check
      - name: Lints
        # --all-targets, because the previous version checked only the binary
        # and let every warning in the test module through.
        run: cargo clippy --all-targets -- -D warnings
      - name: CPU tests
        run: cargo test --lib --bins

  physics:
    name: Physics on a software adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies, including Mesa's software rasteriser
        # lavapipe is a Vulkan implementation that runs on the CPU, so the
        # compute shader is executed for real on a runner with no GPU. Without
        # it every physics test would skip and the suite would be green while
        # asserting nothing.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev \
                                  mesa-vulkan-drivers vulkan-tools
      - name: Show the adapter
        run: vulkaninfo --summary || true
      - name: Physics tests
        # CI is set by GitHub, and one test asserts an adapter is present when
        # it is, so "no adapter" can never quietly mean "physics untested".
        run: cargo test --test physics

  heavy-physics:
    name: Physics at the largest supported grid
    # The two ignored tests need 262,144 particles for thousands of steps, which
    # is minutes of software rasterising. Nightly rather than on every push.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies, including Mesa's software rasteriser
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev \
                                  mesa-vulkan-drivers vulkan-tools
      - name: The heavy physics tests
        run: cargo test --test physics -- --ignored

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # cargo-audit is run directly rather than through rustsec/audit-check,
      # which posts its findings as a check run and so needs `checks: write`.
      # This workflow grants read-only access on purpose, and the job output is
      # just as readable. Running it directly also means the ignore list in
      # .cargo/audit.toml applies, with the reasoning written next to it.
      - uses: taiki-e/install-action@cargo-audit
      - name: Advisories
        # Fails on vulnerabilities. The unmaintained and unsound warnings are
        # printed but do not gate: every one of them arrives through the pinned
        # wgpu-bootstrap tree and none can be resolved from this repository. See
        # SECURITY.md.
        run: cargo audit
